plugins {
	id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

loom {
	runs {
		client {
			ideConfigGenerated = true
			runDir "run/client"
			programArgs "--username", rootProject.properties.getOrDefault('minecraft_username', 'Player1')
		}

		client2 {
			client()
			ideConfigGenerated = true
			name "Fabric Client 2"
			runDir "run/client_alt"
			programArgs "--username", rootProject.properties.getOrDefault('minecraft_second_username', 'Player2')
		}
	}
}

configurations {
	common
	shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
	shadowSqlite
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

repositories {
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url "https://maven.shedaniel.me/"
		name "Shedaniel Maven"
	}
}

dependencies {
	implementation project(":common")
	common(project(path: ":common", configuration: "namedElements")) { transitive = false }
	shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }
	
	// Fabric Loader
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	
	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// Optional compat mods (dev only)
	modCompileOnly("maven.modrinth:s3dmwKy5:0.0.1.1") { transitive = false } // GlitchCore
	modLocalRuntime("maven.modrinth:s3dmwKy5:0.0.1.1") { transitive = false }
	// Loom 1.6 在 dev runtime 下可能忽略 modLocalRuntime，因此补充 modRuntimeOnly 确保 runClient 能加载依赖
	modRuntimeOnly("maven.modrinth:s3dmwKy5:0.0.1.1") { transitive = false }

	// C2ME - 仅 Fabric 端的性能优化模组
	modLocalRuntime("maven.modrinth:c2me-fabric:0.2.0+alpha.11.13+1.20.1")
	modRuntimeOnly("maven.modrinth:c2me-fabric:0.2.0+alpha.11.13+1.20.1")
	
	// Mod Menu - 游戏内模组菜单
	modLocalRuntime("maven.modrinth:modmenu:7.2.2")
	modRuntimeOnly("maven.modrinth:modmenu:7.2.2")
	
	// Architectury API - 内嵌到模组中
	modImplementation("dev.architectury:architectury-fabric:9.2.14") {
		exclude group: "net.fabricmc.fabric-api"
	}
	include("dev.architectury:architectury-fabric:9.2.14")
	
	// Cloth Config API for Fabric
	modApi("me.shedaniel.cloth:cloth-config-fabric:11.1.106") {
		exclude group: "net.fabricmc.fabric-api"
	}
	include("me.shedaniel.cloth:cloth-config-fabric:11.1.106")

	// Maven Artifact API - 比较模组版本和检测冲突模组
	include('org.apache.maven:maven-artifact:3.9.6')

	// H2 Database - 道路数据持久化（纯Java，无native依赖）
	// compileOnly: 编译时, modLocalRuntime: 开发运行时, shadowSqlite: 生产打包
	compileOnly("com.h2database:h2:2.2.224") { transitive = false }
	modLocalRuntime("com.h2database:h2:2.2.224") { transitive = false }
	shadowSqlite("com.h2database:h2:2.2.224") { transitive = false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon, project.configurations.shadowSqlite]
    archiveClassifier.set("dev-shadow")
    
    // 重定位 H2 Database 包
    relocate 'org.h2', 'net.shiroha233.roadweaver.libs.h2'
    
    // 排除不需要的文件
    exclude 'META-INF/versions/**'
    // 排除 H2 中可能触发审查的动态编译/网络服务相关类
    // SourceCompiler 会使用 JavaCompiler/Groovy 动态编译，Server/tools 可能被视为网络服务能力
    exclude 'org/h2/util/SourceCompiler*'
    exclude 'org/h2/tools/**'
    exclude 'org/h2/server/**'
    exclude 'net/shiroha233/roadweaver/libs/h2/util/SourceCompiler*'
    exclude 'net/shiroha233/roadweaver/libs/h2/tools/**'
    exclude 'net/shiroha233/roadweaver/libs/h2/server/**'
    
    // 强制更新 META-INF/services 里的类名
    mergeServiceFiles()
    
    // 排除 module-info.class 避免 JPMS 冲突
    exclude 'module-info.class'
}

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set(null)
}

jar {
	archiveClassifier.set("dev")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
}
sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        java {
            // Avoid JPMS split-package with shaded common (network package) in dev runtime
        }
        resources {
            exclude 'assets/roadweaver/lang/*.json'
            exclude 'pack.mcmeta'
        }
    }
}
