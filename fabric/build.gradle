// 文件职责：配置 Fabric 平台的编译、运行与发布依赖（Minecraft 26.3 已去混淆，无 remap 步骤）。
plugins {
	id 'com.gradleup.shadow'
}

architectury {
	fabric()
}

configurations {
	shadowCommon
	shadowLwjglNatives
	developmentFabric.extendsFrom common
}

repositories {
	// Minecraft 官方库镜像缺少 lwjgl 3.3.3 的 linux-arm64 native，强制该组件从 Maven Central 解析。
	exclusiveContent {
		forRepository {
			mavenCentral()
		}
		filter {
			includeGroup 'org.lwjgl'
		}
	}
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url "https://maven.shedaniel.me/"
		name "Shedaniel Maven"
	}
}

dependencies {
	common(project(path: ":common")) { transitive = false }
	shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation("dev.architectury:architectury-fabric:${project.architectury_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
	include("dev.architectury:architectury-fabric:${project.architectury_version}")

	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
	include("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")

	// Mod Menu 仅用于开发环境预览（26.3 起 Loom 无 remap，普通运行时依赖即可）
	runtimeOnly("maven.modrinth:mOgUt4GM:${project.modmenu_version}")

	// Dedicated servers omit LWJGL. Bundle its Java API and core JNI; the system GPU driver still provides the OpenCL ICD.
	compileOnly("org.lwjgl:lwjgl-opencl:3.3.3") { transitive = false }
	include("org.lwjgl:lwjgl-opencl:3.3.3") { transitive = false }
	include("org.lwjgl:lwjgl:3.3.3") { transitive = false }
	runtimeOnly("org.lwjgl:lwjgl-opencl:3.3.3") { transitive = false }
	shadowLwjglNatives("org.lwjgl:lwjgl:3.3.3:natives-windows") { transitive = false }
	shadowLwjglNatives("org.lwjgl:lwjgl:3.3.3:natives-windows-arm64") { transitive = false }
	shadowLwjglNatives("org.lwjgl:lwjgl:3.3.3:natives-linux") { transitive = false }
	shadowLwjglNatives("org.lwjgl:lwjgl:3.3.3:natives-linux-arm64") { transitive = false }
	shadowLwjglNatives("org.lwjgl:lwjgl:3.3.3:natives-macos") { transitive = false }
	shadowLwjglNatives("org.lwjgl:lwjgl:3.3.3:natives-macos-arm64") { transitive = false }
}

processResources {
	def modVersion = project.version.toString()
	def mcVersion = rootProject.minecraft_version.toString()
	inputs.property "version", modVersion
	inputs.property "minecraft_version", mcVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion, "minecraft_version": mcVersion
	}
}

shadowJar {
	exclude "architectury.common.json"
	configurations = [project.configurations.shadowCommon, project.configurations.shadowLwjglNatives]
	archiveClassifier.set("")

	exclude 'META-INF/versions/**'
	mergeServiceFiles()
	exclude 'module-info.class'

	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

jar {
	archiveClassifier.set("dev")
}

sourcesJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def commonSources = project(':common').sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}

tasks.named('build') {
	dependsOn tasks.named('shadowJar')
}

sourceSets {
	main {
		resources {
			exclude 'pack.mcmeta'
		}
	}
}

// 迁移期辅助：把 fabric 的编译类路径导出，供直接用 javac 迭代使用。
tasks.register('dumpClasspath') {
	notCompatibleWithConfigurationCache("Dumps the resolved compile classpath")
	doLast {
		def out = file("$buildDir/fabric-classpath.txt")
		out.parentFile.mkdirs()
		out.text = configurations.compileClasspath.asPath
	}
}
