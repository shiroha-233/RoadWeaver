 architectury {
    common("fabric", "forge")
}

dependencies {
    // Architectury API（作为 mod 依赖以启用 Loom 重映射）
    modImplementation("dev.architectury:architectury:9.2.14")
    compileOnly("net.fabricmc:fabric-loader:${project.loader_version}")

    // LWJGL OpenCL - 编译时依赖，运行时 native 由平台模块提供
    compileOnly("org.lwjgl:lwjgl-opencl:3.3.1")

    // H2 仅用于读取旧版世界数据，运行时由平台模块打包。
    compileOnly("com.h2database:h2:2.2.224") { transitive = false }

    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testImplementation("org.mockito:mockito-core:5.12.0")
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
 
sourceSets {
    main {
        java {
            exclude 'net/shiroha233/roadweaver/client/gui/**'
        }
        resources {
            exclude 'pack.mcmeta'
        }
    }
}
