// 根项目配置 - 多模块项目
plugins {
	id 'architectury-plugin' version '3.4-SNAPSHOT'
	id 'dev.architectury.loom' version '1.6-SNAPSHOT' apply false
}

architectury {
	minecraft = '1.20.1'
}

def legacyIdeOutputDirs = [
	file('common/bin'),
	file('fabric/bin'),
	file('forge/bin')
]

tasks.register('cleanLegacyIdeOutputs', Delete) {
	description = 'Deletes stale IDE output directories that can shadow Gradle build outputs at dev runtime.'
	delete legacyIdeOutputDirs
}

allprojects {
	apply plugin: 'java'
	apply plugin: 'architectury-plugin'
	
	group = 'net.shiroha233.roadweaver'
	version = '2.3.1-1.20.1'
	
	repositories {
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://maven.minecraftforge.net/' }
		maven { url = 'https://maven.shedaniel.me/' }
		maven { url = 'https://maven.terraformersmc.com/' }
        // curseforge与modrinth平台仓库
        exclusiveContent {
            forRepository {
                maven {
                    name = 'CurseMaven'
                    url = 'https://cursemaven.com'
                }
            }
            filter {
                includeGroup 'curse.maven'
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven'
                }
            }
            filter {
                includeGroup 'maven.modrinth'
            }
        }
		mavenCentral()
	}
	
	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 17
	}
	
	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(17)
		}
		withSourcesJar()
	}
	
	// Gradle toolchain 默认只影响编译任务；runClient/Transformer 属于 JavaExec，
	// 这里强制所有 JavaExec 使用 Java 17 launcher，保证开发运行环境一致。
	tasks.withType(JavaExec).configureEach {
		javaLauncher = javaToolchains.launcherFor {
			languageVersion = JavaLanguageVersion.of(17)
		}
		// 设置运行游戏时的玩家名称
		systemProperty 'minecraft.username', rootProject.properties.getOrDefault('minecraft_username', 'Player')
	}
}

subprojects {
	apply plugin: 'dev.architectury.loom'

	tasks.named('clean').configure {
		dependsOn rootProject.tasks.named('cleanLegacyIdeOutputs')
	}

	tasks.withType(JavaExec).configureEach {
		dependsOn rootProject.tasks.named('cleanLegacyIdeOutputs')
	}
	
	base {
		archivesName = "${rootProject.name}-${project.name}"
	}
	
	loom {
		silentMojangMappingsLicense()
	}
	
	dependencies {
		minecraft "com.mojang:minecraft:1.20.1"
		mappings loom.officialMojangMappings()
	}
	
	// 配置runClient任务，设置固定的玩家名称（仅 Fabric）
	if (project.name == 'fabric') {
		tasks.named('runClient', JavaExec).configure {
			def username = rootProject.properties.getOrDefault('minecraft_username', 'Player')
			args '--username', username
		}
	}
}
