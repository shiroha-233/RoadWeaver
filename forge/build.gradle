/* 文件职责：配置 Forge 1.20.1 平台的编译、运行与发布依赖。 */
plugins {
	id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "roadweaver.mixins.json"
    }
    runs {
        client {
            client()
            ideConfigGenerated = true
            name "Forge Client"
            runDir "run/client"
            vmArgs "-Xmx2G", "-XX:+UseG1GC"
            programArgs "--username", rootProject.properties.getOrDefault('minecraft_username', 'Player1')
        }
        server {
            server()
            ideConfigGenerated = true
            name "Forge Server"
            runDir "run/server"
            vmArgs "-Xmx2G",
                   "-XX:+UseG1GC"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
    shadowLwjglOpenCl
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

shadowJar {
    exclude "architectury.common.json"
    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowCommon, project.configurations.shadowLwjglOpenCl]
    archiveClassifier.set("dev-shadow")

    // 排除不需要的文件
    exclude 'META-INF/versions/**'

    // 强制更新 META-INF/services 里的类名
    mergeServiceFiles()

    // 排除 module-info.class 避免 JPMS 冲突
    exclude 'module-info.class'
}

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
}

tasks.register('verifyLwjglPackaging') {
    description = 'Verifies that only the OpenCL binding is embedded and the LWJGL core remains external.'
    group = 'verification'
    dependsOn remapJar

    doLast {
        def artifact = remapJar.archiveFile.get().asFile
        def entryNames = []
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            zip.entries().each { entryNames.add(it.name) }
        }

        def embeddedOpenCl = entryNames.contains('org/lwjgl/opencl/CL.class')
        def embeddedLwjglCore = entryNames.any {
            it.startsWith('org/lwjgl/') &&
                    !it.startsWith('org/lwjgl/opencl/') &&
                    it.endsWith('.class')
        }
        def bundledLwjglModule = entryNames.any {
            it.startsWith('META-INF/jars/lwjgl') && it.endsWith('.jar')
        }
        if (!embeddedOpenCl || embeddedLwjglCore || bundledLwjglModule) {
            throw new GradleException('Forge artifact has an invalid LWJGL package layout')
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyLwjglPackaging')
}

jar {
	archiveClassifier.set("dev")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}

	manifest {
		attributes([
			'Specification-Title'     : 'RoadWeaver',
			'Specification-Vendor'    : 'shiroha233',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'shiroha233'
		])
	}
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.shedaniel.me/"
        name "Shedaniel Maven"
    }
    maven {
        url = "https://api.modrinth.com/maven"
        name = "Modrinth Maven"
    }
    maven {
        url "https://bmclapi2.bangbang93.com/maven/"
        name "Forge Mirror"
    }
    maven {
        url "https://maven.minecraftforge.net/"
        name "Forge"
    }
    maven {
        url "https://maven.architectury.dev/"
        name "Architectury"
    }
    maven {
        url "https://cursemaven.com"
        name "CurseMaven"
    }
    maven {
        url "https://repo.lwjgl.org/"
        name "LWJGL Maven"
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: project.minecraft_version,
        minecraft_version_range: '[1.20.1,1.21)',
        forge_version: project.forge_version,
        forge_version_range: '[47,48)',
        loader_version_range: '[47,)',
        mod_id: 'roadweaver',
        mod_name: 'RoadWeaver',
        mod_version: project.version,
        mod_authors: 'shiroha233',
        mod_description: 'Automatically generates roads between structures'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

dependencies {
    // Common 模块 - 添加源代码到编译路径
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }

    // Forge 平台
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Optional compatibility mods can be enabled here for development runs.
    // modCompileOnly("maven.modrinth:s3dmwKy5:xxx") { transitive = false } // GlitchCore
    // modCompileOnly("maven.modrinth:e0bNACJD:xxx") { transitive = false } // SereneSeasons Forge 1.20.1
    // modCompileOnly("maven.modrinth:distanthorizons:xxx") { transitive = false } // Distant Horizons

    // Architectury API - 使用 Jar-in-Jar 内嵌
    modApi("dev.architectury:architectury-forge:${project.architectury_version}")
    include("dev.architectury:architectury-forge:${project.architectury_version}")

    // Cloth Config API for Forge - Jar-in-Jar include
    modApi("me.shedaniel.cloth:cloth-config-forge:${project.cloth_config_version}")
    include("me.shedaniel.cloth:cloth-config-forge:${project.cloth_config_version}")

    // DynamicTrees - 可选依赖，用于 Mixin 兼容
    // Modrinth Maven uses the project slug and the loader/game-version prefix
    // for Dynamic Trees artifacts (the numeric project id is not a Maven artifact).
    modCompileOnly "maven.modrinth:dynamictrees:${project.minecraft_version}-${project.dynamictrees_version}"
    modRuntimeOnly "maven.modrinth:dynamictrees:${project.minecraft_version}-${project.dynamictrees_version}"

    // Touhou Little Maid (车万女仆)
    if (project.findProperty("enableTouhouLittleMaidRuntime") == "true") {
        modRuntimeOnly "maven.modrinth:R0bDWFAW:${project.touhou_little_maid_forge_version}"
    }

    // 仅合并 OpenCL binding；客户端复用 Minecraft 的 LWJGL，专服缺少 LWJGL 时自动回退 CPU。
    // shadowJar 会移除 binding 的 module-info，避免专服启动时强制解析 org.lwjgl 模块。
    compileOnly("org.lwjgl:lwjgl-opencl:3.3.3") { transitive = false }
    shadowLwjglOpenCl("org.lwjgl:lwjgl-opencl:3.3.3") { transitive = false }
    forgeRuntimeLibrary("org.lwjgl:lwjgl-opencl:3.3.3") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-opencl:3.3.3") { transitive = false }

    forgeRuntimeLibrary("org.apache.lucene:lucene-core:8.11.2") { transitive = false }
    forgeRuntimeLibrary("org.apache.lucene:lucene-analyzers-common:8.11.2") { transitive = false }
    forgeRuntimeLibrary("org.apache.lucene:lucene-queryparser:8.11.2") { transitive = false }
}

// Source JAR 组装（合并 common 源码）
sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
	main {
		java {
			// Avoid JPMS split-package: keep top-level network package only in common
		}
		resources {
		}
	}
}
