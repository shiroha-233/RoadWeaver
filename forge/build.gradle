plugins {
	id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "roadweaver.mixins.json"
    }
    runs {
        client {
            client()
            ideConfigGenerated = true
            name "Forge Client"
            runDir "run/client"
            vmArgs "-Dneoforge.enabledGameTestNamespace=roadweaver"
            programArgs "--username", rootProject.properties.getOrDefault('minecraft_username', 'Player1')
        }
        client2 {
            client()
            ideConfigGenerated = true
            name "Forge Client 2"
            runDir "run/client_alt"
            vmArgs "-Dneoforge.enabledGameTestNamespace=roadweaver"
            programArgs "--username", rootProject.properties.getOrDefault('minecraft_second_username', 'Player2')
        }
        server {
            server()
            name "Forge Server"
            runDir "run/server"
            vmArgs "-Dneoforge.enabledGameTestNamespace=roadweaver"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
    shadowSqlite
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon, project.configurations.shadowSqlite]
    archiveClassifier.set("dev-shadow")
    
    // 重定位 H2 Database 包
    relocate 'org.h2', 'net.shiroha233.roadweaver.libs.h2'
    
    // 排除不需要的文件
    exclude 'META-INF/versions/**'
    // 排除 H2 中可能触发审查的动态编译/网络服务相关类
    // SourceCompiler 会使用 JavaCompiler/Groovy 动态编译，Server/tools 可能被视为网络服务能力
    exclude 'org/h2/util/SourceCompiler*'
    exclude 'org/h2/tools/**'
    exclude 'org/h2/server/**'
    exclude 'net/shiroha233/roadweaver/libs/h2/util/SourceCompiler*'
    exclude 'net/shiroha233/roadweaver/libs/h2/tools/**'
    exclude 'net/shiroha233/roadweaver/libs/h2/server/**'
    
    // 强制更新 META-INF/services 里的类名
    mergeServiceFiles()
    
    // 排除 module-info.class 避免 JPMS 冲突
    exclude 'module-info.class'
}

// 移除原生库修改任务，改为纯 Java 方式处理数据库依赖

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
}

jar {
	archiveClassifier.set("dev")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
	
	manifest {
		attributes([
			'Specification-Title'     : 'RoadWeaver',
			'Specification-Vendor'    : 'shiroha233',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'shiroha233'
		])
	}
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.shedaniel.me/"
        name "Shedaniel Maven"
    }
    maven {
        url "https://maven.minecraftforge.net/"
        name "Forge"
    }
    maven {
        url "https://maven.architectury.dev/"
        name "Architectury"
    }
    maven {
        url "https://cursemaven.com"
        name "CurseMaven"
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: project.minecraft_version,
        minecraft_version_range: '[1.20.1,1.21)',
        forge_version: project.forge_version,
        forge_version_range: '[47,48)',
        loader_version_range: '[47,)',
        mod_id: 'roadweaver',
        mod_name: 'RoadWeaver',
        mod_version: project.mod_version,
        mod_authors: 'shiroha233',
        mod_description: 'Automatically generates roads between structures'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

dependencies {
    // Common 模块 - 添加源代码到编译路径
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }

    // Forge 平台
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Optional compat mods (dev only)
    modCompileOnly("maven.modrinth:s3dmwKy5:0.0.1.1") { transitive = false } // GlitchCore
    modCompileOnly("maven.modrinth:e0bNACJD:9.1.0.0") { transitive = false } // SereneSeasons Forge 1.20.1
    modCompileOnly("maven.modrinth:c2mef:0.2.0+alpha.12") { transitive = false } // C2ME-forge
    modCompileOnly("maven.modrinth:distanthorizons:2.4.5-b-1.20.1") { transitive = false } // Distant Horizons
    modRuntimeOnly("maven.modrinth:s3dmwKy5:0.0.1.1") { transitive = false }
    modRuntimeOnly("maven.modrinth:e0bNACJD:9.1.0.0") { transitive = false }
    modRuntimeOnly("maven.modrinth:c2mef:0.2.0+alpha.12") { transitive = false }
    modRuntimeOnly("maven.modrinth:distanthorizons:2.4.5-b-1.20.1") { transitive = false }
    modCompileOnly("curse.maven:the-lost-cities-269024:6174986") { transitive = false } // The Lost Cities 1.20-7.3.6
    modRuntimeOnly("curse.maven:the-lost-cities-269024:6174986") { transitive = false }

    // Architectury API - 使用 Jar-in-Jar 内嵌
    modApi("dev.architectury:architectury-forge:9.2.14")
    include("dev.architectury:architectury-forge:9.2.14")

    // Cloth Config API for Forge - Jar-in-Jar include
    modApi("me.shedaniel.cloth:cloth-config-forge:11.1.136")
    include("me.shedaniel.cloth:cloth-config-forge:11.1.136")

    // H2 Database - 道路数据持久化（纯Java，无native依赖）
    // compileOnly: 编译时, forgeRuntimeLibrary: 开发运行时, shadowSqlite: 生产打包
    compileOnly("com.h2database:h2:2.2.224") { transitive = false }
    forgeRuntimeLibrary("com.h2database:h2:2.2.224") { transitive = false }
    shadowSqlite("com.h2database:h2:2.2.224") { transitive = false }

    // 联动兼容 动态的树 Dynamic Trees
    // 换成modCompileOnly可以临时关闭此mod的运行以测试非联动状态
    modImplementation("maven.modrinth:dynamictrees:${minecraft_version}-${dynamictrees_version}")

    // Maven Artifact API - 比较模组版本和检测冲突模组
    include('org.apache.maven:maven-artifact:3.9.6')
}

// Source JAR 组装（合并 common 源码）
sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        java {
            // Avoid JPMS split-package: keep top-level network package only in common
        }
        resources {
            exclude 'assets/roadweaver/lang/*.json'
        }
    }
}
