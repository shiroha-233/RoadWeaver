/* 文件职责：配置 NeoForge 平台的编译、运行与发布依赖。 */
plugins {
	id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        client {
            client()
            name "NeoForge Client"
            runDir "run/client"
            vmArgs "-Dneoforge.enabledGameTestNamespace=roadweaver"
            programArgs "--username", "Player1"
        }
        server {
            server()
            name "NeoForge Server"
            runDir "run/server"
            vmArgs "-Dneoforge.enabledGameTestNamespace=roadweaver",
                   "-Xmx2G",
                   "-XX:+UseG1GC"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
    shadowLwjglOpenCl
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

shadowJar {
    exclude "architectury.common.json"
    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowCommon, project.configurations.shadowLwjglOpenCl]
    archiveClassifier.set("dev-shadow")
    
    // 排除不需要的文件
    exclude 'META-INF/versions/**'
    
    // 强制更新 META-INF/services 里的类名
    mergeServiceFiles()
    
    // 排除 module-info.class 避免 JPMS 冲突
    exclude 'module-info.class'

    // binding 搬入 shaded 包：NeoForge 按 JPMS 模块层加载 mod，任何其他 mod 一旦
    // 也导出 org.lwjgl.opencl（如 Worldgen Accelerator），重复包会直接导致启动失败。
    relocate 'org.lwjgl.opencl', 'net.shiroha233.roadweaver.shaded.lwjgl.opencl'
}

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
}

tasks.register('verifyLwjglPackaging') {
    description = 'Verifies the OpenCL binding is embedded only under the shaded package and no LWJGL packages leak through.'
    group = 'verification'
    dependsOn remapJar

    doLast {
        def artifact = remapJar.archiveFile.get().asFile
        def entryNames = []
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            zip.entries().each { entryNames.add(it.name) }
        }

        def embeddedOpenCl = entryNames.contains('net/shiroha233/roadweaver/shaded/lwjgl/opencl/CL.class')
        def leakedLwjglClasses = entryNames.any {
            it.startsWith('org/lwjgl/') && it.endsWith('.class')
        }
        def bundledLwjglModule = entryNames.any {
            it.startsWith('META-INF/jars/lwjgl') && it.endsWith('.jar')
        }
        if (!embeddedOpenCl || leakedLwjglClasses || bundledLwjglModule) {
            throw new GradleException('NeoForge artifact has an invalid LWJGL package layout')
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyLwjglPackaging')
}

jar {
	archiveClassifier.set("dev")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
	
	manifest {
		attributes([
			'Specification-Title'     : 'RoadWeaver',
			'Specification-Vendor'    : 'shiroha233',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'shiroha233'
		])
	}
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.shedaniel.me/"
        name "Shedaniel Maven"
    }
    maven {
        url = "https://api.modrinth.com/maven"
        name = "Modrinth Maven"
    }
    maven {
        url "https://bmclapi2.bangbang93.com/maven/"
        name "NeoForge Mirror"
    }
    maven {
        url "https://maven.neoforged.net/releases/"
        name "NeoForge"
    }
    maven {
        url "https://maven.architectury.dev/"
        name "Architectury"
    }
    maven {
        url "https://cursemaven.com"
        name "CurseMaven"
    }
    maven {
        url "https://repo.lwjgl.org/"
        name "LWJGL Maven"
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: '1.21.1',
        minecraft_version_range: '[1.21.1,1.22)',
        neoforge_version: project.neoforge_version,
        neoforge_version_range: '[21.1,)',
        loader_version_range: '[4,)',
        mod_id: 'roadweaver',
        mod_name: 'RoadWeaver',
        mod_version: project.version,
        mod_authors: 'shiroha233',
        mod_description: 'Automatically generates roads between structures'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

dependencies {
    // Common 模块 - 添加源代码到编译路径
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }

    // NeoForge 平台
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    // Optional compat mods (dev only)
    // TODO: 等待这些模组更新到 1.21.1 后取消注释
    // modCompileOnly("maven.modrinth:s3dmwKy5:xxx") { transitive = false } // GlitchCore
    // modCompileOnly("maven.modrinth:e0bNACJD:xxx") { transitive = false } // SereneSeasons NeoForge 1.21.1
    // modCompileOnly("maven.modrinth:distanthorizons:xxx") { transitive = false } // Distant Horizons

    // Architectury API - 使用 Jar-in-Jar 内嵌
    modApi("dev.architectury:architectury-neoforge:${project.architectury_version}")
    include("dev.architectury:architectury-neoforge:${project.architectury_version}")

    // Cloth Config API for NeoForge - Jar-in-Jar include
    modApi("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}")
    include("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}")
    
    // DynamicTrees - 可选依赖，用于 Mixin 兼容
    modCompileOnly "maven.modrinth:vdjF5PL5:${project.dynamictrees_version}"
    modRuntimeOnly "maven.modrinth:vdjF5PL5:${project.dynamictrees_version}"

    // Touhou Little Maid (车万女仆)
    if (project.findProperty("enableTouhouLittleMaidRuntime") == "true") {
        modRuntimeOnly "maven.modrinth:R0bDWFAW:${project.touhou_little_maid_neoforge_version}"
    }

    // 仅合并 OpenCL binding；客户端复用 Minecraft 的 LWJGL，专服缺少 LWJGL 时自动回退 CPU。
    // shadowJar 会移除 binding 的 module-info，避免专服启动时强制解析 org.lwjgl 模块，
    // 并将 binding relocate 到 net.shiroha233.roadweaver.shaded.lwjgl.opencl（见 shadowJar 配置）。
    compileOnly("org.lwjgl:lwjgl-opencl:3.3.3") { transitive = false }
    shadowLwjglOpenCl("org.lwjgl:lwjgl-opencl:3.3.3") { transitive = false }
    forgeRuntimeLibrary("org.lwjgl:lwjgl-opencl:3.3.3") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-opencl:3.3.3") { transitive = false }

    forgeRuntimeLibrary("org.apache.lucene:lucene-core:8.11.2") { transitive = false }
    forgeRuntimeLibrary("org.apache.lucene:lucene-analyzers-common:8.11.2") { transitive = false }
    forgeRuntimeLibrary("org.apache.lucene:lucene-queryparser:8.11.2") { transitive = false }
}

// Source JAR 组装（合并 common 源码）
sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
	main {
		java {
			// Avoid JPMS split-package: keep top-level network package only in common
		}
		resources {
		}
	}
}
