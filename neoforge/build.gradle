/* 文件职责：配置 NeoForge 平台的编译、运行与发布依赖（Minecraft 26.3 已去混淆，无 remap 步骤）。 */
plugins {
	id 'com.gradleup.shadow'
}

architectury {
	neoForge()
}

loom {
	runs {
		client {
			client()
			name "NeoForge Client"
			runDir "run/client"
			vmArgs "-Dneoforge.enabledGameTestNamespace=roadweaver"
			programArgs "--username", "Player1"
		}
		server {
			server()
			name "NeoForge Server"
			runDir "run/server"
			vmArgs "-Dneoforge.enabledGameTestNamespace=roadweaver",
					"-Xmx2G",
					"-XX:+UseG1GC"
		}
	}
}

configurations {
	shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
	shadowLwjglOpenCl
	developmentNeoForge.extendsFrom common
}

repositories {
	mavenCentral()
	maven {
		url "https://maven.shedaniel.me/"
		name "Shedaniel Maven"
	}
	maven {
		url = "https://api.modrinth.com/maven"
		name "Modrinth Maven"
	}
	maven {
		url "https://bmclapi2.bangbang93.com/maven/"
		name "NeoForge Mirror"
	}
	maven {
		url "https://maven.neoforged.net/releases/"
		name "NeoForge"
	}
	maven {
		url "https://maven.architectury.dev/"
		name "Architectury"
	}
	maven {
		url "https://cursemaven.com"
		name "CurseMaven"
	}
	maven {
		url "https://repo.lwjgl.org/"
		name "LWJGL Maven"
	}
}

dependencies {
	// Common 模块 - 添加源代码到编译路径
	common(project(path: ":common")) { transitive = false }
	shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

	// NeoForge 平台
	neoForge "net.neoforged:neoforge:${project.neoforge_version}"

	// Architectury API - 使用 Jar-in-Jar 内嵌
	implementation("dev.architectury:architectury-neoforge:${project.architectury_version}")
	include("dev.architectury:architectury-neoforge:${project.architectury_version}")

	// Cloth Config API for NeoForge - Jar-in-Jar include
	implementation("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}")
	include("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}")

	// 仅合并 OpenCL binding；客户端复用 Minecraft 的 LWJGL，专服缺少 LWJGL 时自动回退 CPU。
	// shadowJar 会移除 binding 的 module-info，避免专服启动时强制解析 org.lwjgl 模块。
	compileOnly("org.lwjgl:lwjgl-opencl:3.3.3") { transitive = false }
	shadowLwjglOpenCl("org.lwjgl:lwjgl-opencl:3.3.3") { transitive = false }
	runtimeOnly("org.lwjgl:lwjgl-opencl:3.3.3") { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
	def replaceProperties = [
		minecraft_version: rootProject.minecraft_version,
		minecraft_version_range: '[26.3,26.4)',
		neoforge_version: project.neoforge_version,
		neoforge_version_range: '[26.3.0,)',
		loader_version_range: '[4,)',
		mod_id: 'roadweaver',
		mod_name: 'RoadWeaver',
		mod_version: project.version.toString(),
		mod_authors: 'shiroha233',
		mod_description: 'Automatically generates roads between structures'
	]

	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml']) {
		expand replaceProperties
	}
}

shadowJar {
	exclude "architectury.common.json"
	exclude "fabric.mod.json"
	configurations = [project.configurations.shadowCommon, project.configurations.shadowLwjglOpenCl]
	archiveClassifier.set("")

	// 排除不需要的文件
	exclude 'META-INF/versions/**'

	// 强制更新 META-INF/services 里的类名
	mergeServiceFiles()

	// 排除 module-info.class 避免 JPMS 冲突
	exclude 'module-info.class'

	relocate 'org.lwjgl.opencl', 'net.shiroha233.roadweaver.shaded.lwjgl.opencl'

	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

tasks.register('dumpClasspath') {
	description = 'Dumps the compile classpath for the migration javac harness.'
	group = 'verification'
	notCompatibleWithConfigurationCache('Writes a snapshot of the resolved classpath.')

	doLast {
		def target = file("${buildDir}/neoforge-classpath.txt")
		target.parentFile.mkdirs()
		target.text = configurations.compileClasspath.asPath
	}
}

tasks.register('verifyLwjglPackaging') {
	description = 'Verifies the OpenCL binding is embedded only under the shaded package and no LWJGL packages leak through.'
	group = 'verification'
	dependsOn shadowJar

	doLast {
		def artifact = shadowJar.archiveFile.get().asFile
		def entryNames = []
		new java.util.zip.ZipFile(artifact).withCloseable { zip ->
			zip.entries().each { entryNames.add(it.name) }
		}

		def embeddedOpenCl = entryNames.contains('net/shiroha233/roadweaver/shaded/lwjgl/opencl/CL.class')
		def leakedLwjglClasses = entryNames.any {
			it.startsWith('org/lwjgl/') && it.endsWith('.class')
		}
		def bundledLwjglModule = entryNames.any {
			it.startsWith('META-INF/jars/lwjgl') && it.endsWith('.jar')
		}
		if (!embeddedOpenCl || leakedLwjglClasses || bundledLwjglModule) {
			throw new GradleException('NeoForge artifact has an invalid LWJGL package layout')
		}
	}
}

tasks.named('check').configure {
	dependsOn tasks.named('verifyLwjglPackaging')
}

jar {
	archiveClassifier.set("dev")

	manifest {
		attributes([
			'Specification-Title'     : 'RoadWeaver',
			'Specification-Vendor'    : 'shiroha233',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'shiroha233'
		])
	}
}

tasks.named('build') {
	dependsOn tasks.named('shadowJar')
}

// Source JAR 组装（合并 common 源码）
sourcesJar {
	// Avoid duplicate entries when merging common sources
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def commonSources = project(":common").sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}
